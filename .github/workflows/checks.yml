name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Синтаксис
        run: python -m compileall -q app.py build_exe.py core tools tests

      - name: Тесты установщика
        run: python tests\test_install.py

      - name: Тест обратной связи
        run: python tests\test_feedback.py

      - name: Тексты и подписи не врут
        run: python tools\lint_claims.py

      - name: Приложение импортируется
        run: python -c "import app; print('версия', app.VERSION)"
