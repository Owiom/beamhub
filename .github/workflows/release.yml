name: Release

# Собирает BeamHub.exe и прикрепляет портативный архив к релизу.
# Запуск: git tag v0.6.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Собрать
        shell: pwsh
        run: |
          python -V
          python -m PyInstaller --version
          python build_exe.py --onedir 2>&1 | Tee-Object -FilePath build.log
          if (Test-Path build.log) { Get-Content build.log -Tail 40 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }

      - name: Лог сборки на случай падения
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            git config user.name "ci"
            git config user.email "ci@beamhub.local"
            git checkout -b ci-log
            Copy-Item build.log log-fail.txt
            git add -f log-fail.txt
            git commit -m "build log"
            git push -f origin ci-log
          }

      - name: Упаковать
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "BeamHub-$tag-win64-portable.zip"
          New-Item -ItemType Directory -Path pack | Out-Null
          Copy-Item dist\BeamHub -Destination pack\BeamHub -Recurse
          Copy-Item ЧИТАЙ-МЕНЯ.txt, README.md, SECURITY.md, LICENSE -Destination pack
          if (Test-Path docs) { Copy-Item docs -Destination pack\docs -Recurse }
          Compress-Archive -Path "pack\*" -DestinationPath $name
          "ARCHIVE=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Прикрепить к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
